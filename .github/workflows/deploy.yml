name: Deploy

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: 8bit-cafe-deploy
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DOCKER_BUILDKIT: 1
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD || github.token }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Erlang
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "27"
          rebar3-version: "3.24.0"

      - name: Install Gleam
        run: |
          curl -fsSL https://github.com/gleam-lang/gleam/releases/download/v1.17.0/gleam-v1.17.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin
          gleam --version

      - name: Build production bundle
        run: gleam deps download && tools/build.sh

      - name: Verify required secrets
        shell: bash
        run: |
          missing=()
          for v in DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          {
            printf 'Host %s\n' "$DEPLOY_HOST"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile ~/.ssh/known_hosts\n'
            printf '  LogLevel ERROR\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ferdev
          password: ${{ env.KAMAL_REGISTRY_PASSWORD }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal -v "2.10.1"

      - name: Write Kamal secrets
        shell: bash
        run: |
          mkdir -p .kamal
          umask 077
          cat > .kamal/secrets <<'SECRETS_EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          SECRETS_EOF
          sed -i 's/^[[:space:]]*//' .kamal/secrets

      - name: Docker storage preflight
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < scripts/docker-storage-preflight.sh 12 1

      - name: Release stale deploy lock
        run: kamal lock release || true

      - name: Ensure Kamal proxy
        run: kamal proxy boot || true

      - name: Deploy
        run: kamal deploy

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://8bit.cafe/up | grep -qx ok
          curl -fsS https://8bit.cafe/ | grep -q "8bit.cafe"
