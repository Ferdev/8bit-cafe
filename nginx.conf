server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/gif;

    # Kamal Proxy healthcheck
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # The browser still owns the Jev SDK call and credential. Relaying this one
    # fixed path through the site origin avoids TypeSafe's cross-origin block;
    # nginx forwards Authorization without storing or logging its value.
    location = /typesafe/v1/systemone {
        proxy_pass https://api.typesafe.ai/v1/systemone;
        proxy_ssl_server_name on;
        proxy_ssl_name api.typesafe.ai;
        proxy_set_header Host api.typesafe.ai;
        proxy_set_header Authorization "Bearer $http_x_chipcafe_jev_key";
        proxy_set_header X-Chipcafe-Jev-Key "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Long cache for immutable static assets
    location ~* \.(gif|css)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
