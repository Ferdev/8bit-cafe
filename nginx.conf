server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/gif;

    # Kamal Proxy healthcheck
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Long cache for immutable static assets
    location ~* \.(gif|js|css)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
