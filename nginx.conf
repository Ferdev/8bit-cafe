server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/gif;

    # Kamal Proxy healthcheck
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Same-origin proxies for stations that only serve plain HTTP
    # (browsers block/upgrade-fail HTTP audio on an HTTPS page)
    location = /streams/slay {
        proxy_pass http://relay4.slayradio.org:8000/;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Icy-MetaData "0";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /streams/kaaos {
        proxy_pass http://stream.kaaosradio.fi:8000/chip;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Icy-MetaData "0";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /streams/kohina {
        proxy_pass http://kohina.duckdns.org:8000/stream.ogg;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Icy-MetaData "0";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /streams/kohina-aac {
        proxy_pass http://kohina.duckdns.org:8000/stream.aac;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Icy-MetaData "0";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Long cache for immutable static assets
    location ~* \.(gif|js|css)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
