server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/gif;

    # Kamal Proxy healthcheck
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Same-origin proxies for stations that only serve plain HTTP
    # (browsers block/upgrade-fail HTTP audio on an HTTPS page).
    # Runtime resolution with ipv6=off: containers have no IPv6 route,
    # and startup resolution caches AAAA answers otherwise.
    resolver 127.0.0.11 ipv6=off valid=60s;

    location = /streams/slay {
        set $upstream http://relay4.slayradio.org:8000/;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Icy-MetaData "0";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /streams/kaaos {
        set $upstream http://stream.kaaosradio.fi:8000/chip;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Icy-MetaData "0";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /streams/kohina {
        set $upstream http://kohina.duckdns.org:8000/stream.ogg;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Icy-MetaData "0";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /streams/kohina-aac {
        set $upstream http://kohina.duckdns.org:8000/stream.aac;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Icy-MetaData "0";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Long cache for immutable static assets
    location ~* \.(gif|js|css)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
